aid: kalki-zebec-kalkire
name: Zebec Network
description: >-
  Zebec Network is a blockchain infrastructure company (founded 2021, San Francisco;
  founder Sam Thapaliya) building real-time payroll, on-chain payments, multi-chain
  debit/crypto cards, and treasury management for web3 businesses and individuals.
  Its continuous-settlement streaming protocol began on Solana and now spans EVM
  chains, NEAR, and BNB via a Wormhole-based cross-chain bridge. Zebec exposes its
  capabilities to developers as a family of first-party TypeScript/JavaScript SDKs
  published on npm under the @zebec-network, @zebec-protocol, and @zebec-fintech
  scopes — covering payroll streaming, the vault, staking, the Silver/instant cards,
  the bridge, and the Solana DAO — documented at docs.zebec.io. Surfaced as a
  500 Global portfolio company and enriched into the API Evangelist network.
